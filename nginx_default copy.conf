server {
        listen 80 ;
        listen [::]:80 ;

        server_name html.task-master.com;
        
        return 301 https://$host$request_uri;
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name html.task-master.com;

        ssl_certificate /etc/nginx/ssl/task-master-public.crt;
        ssl_certificate_key /etc/nginx/ssl/task-master-public.key;

        location / {
                proxy_pass http://0.0.0.0:3002;
                include proxy_params;
                
        }

} 